media:
  input: "images"
  output: "/images"

content:
  - type: collection
    name: reviews
    label: Game Reviews
    path: "content/reviews"
    subfolders: true
    format: md
    fields:
      - name: title
        label: Game Title
        type: string
      - name: publisher
        label: Publisher
        type: string
      - name: body
        label: Review Content
        type: rich-text
